name: Sondagem das fontes
on:
  push:
    branches: [melhoria-analise]
    paths: [tests/probe.mjs, .github/workflows/sondagem.yml]
jobs:
  sondar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/probe.mjs all
