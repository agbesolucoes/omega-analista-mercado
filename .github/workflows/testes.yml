name: Testes
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # toda segunda, 6h de Brasília: confere se as APIs públicas continuam respondendo
  workflow_dispatch:
jobs:
  simulado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
  apis-reais:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-apis-reais
          path: test-results/
